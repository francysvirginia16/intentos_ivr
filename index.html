<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard IVR — Intentos por Teléfono</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f1f2;--s1:#ffffff;--s2:#faf7f8;--s3:#f0eaeb;--bd:#e0d4d6;
  --green:#1a9e6a;--amber:#d97706;--red:#dc2626;
  --txt:#1a0d0f;--muted:#8a6068;--dim:#e8dfe0;
  --f:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --burdo:#8b1c2a;--burdo-light:#c42840;--burdo-bright:#e8304a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:12px;height:100vh;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:190px;min-width:190px;background:var(--burdo);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:14px 14px 10px;font-size:13px;font-weight:600;color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}
.sb-logo small{display:block;font-size:10px;font-weight:400;opacity:.6;margin-top:2px}
.sb-item{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);border-left:3px solid transparent;transition:all .12s}
.sb-item:hover{background:rgba(255,255,255,.1)}
.sb-item.active{background:rgba(255,255,255,.18);border-left-color:#fff}
.sb-item.active .sb-name{color:#fff;font-weight:600}
.sb-item.active .sb-val{color:#fff;opacity:.7}
.sb-name{font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.85)}
.sb-val{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.55)}
.sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{background:var(--s1);border-bottom:2px solid var(--burdo);padding:12px 20px;flex-shrink:0}
.topbar-row1{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.topbar-title{font-size:22px;font-weight:600;letter-spacing:-.02em}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.06em}
.topbar-sub{font-size:12px;color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi.g::before{background:var(--green)}.kpi.b::before{background:linear-gradient(90deg,var(--burdo-light),var(--burdo-bright))}.kpi.a::before{background:var(--amber)}.kpi.r::before{background:var(--red)}
.kpi-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi-v{font-size:22px;font-weight:600;font-family:var(--fm);line-height:1}
.kpi-s{font-size:10px;color:var(--muted);margin-top:4px}

/* CONTENT */
.content{flex:1;overflow:auto;padding:16px 20px}

/* BUCKET CARDS — siempre visibles */
.bucket-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.bk{border-radius:8px;padding:14px 16px;border:1px solid;position:relative}
.bk-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.bk-val{font-size:24px;font-weight:600;font-family:var(--fm);line-height:1}
.bk-sub{font-size:10px;margin-top:5px}
.bk-bar{height:4px;border-radius:2px;margin-top:10px;background:rgba(0,0,0,.08);overflow:hidden}
.bk-bar-fill{height:100%;border-radius:2px}
.bk-mode{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-bottom:2px}

/* FILTER PANEL */
.filter-panel{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:10px;color:var(--burdo);font-weight:600;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;min-width:52px}
.chip{padding:3px 9px;border-radius:20px;border:1px solid var(--bd);background:none;color:var(--muted);font-size:10px;cursor:pointer;transition:all .12s;font-family:var(--f)}
.chip:hover{border-color:var(--burdo-light);color:var(--burdo-light)}
.chip.on{border-color:var(--burdo-light);background:rgba(196,40,64,.1);color:var(--burdo-light);font-weight:600}
.chip.reset{background:var(--s3)}

/* TABS */
.tab-bar{display:flex;gap:6px;margin-bottom:14px}
.tab{padding:5px 14px;border-radius:20px;border:1px solid var(--bd);background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:var(--f);transition:all .12s;font-weight:500}
.tab.on{border-color:var(--burdo-light);background:rgba(196,40,64,.12);color:var(--burdo-light);font-weight:600}

/* SECTION LABEL */
.sec-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--burdo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--burdo);opacity:.25}
.tbl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tbl-header .sec-label{flex:1;margin-right:10px;margin-bottom:0}
.tbl-header .sec-label::after{display:none}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--bd);margin-bottom:16px}
table.res{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
table.res thead th{padding:7px 10px;text-align:right;font-size:10px;font-weight:500;color:var(--burdo);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--bd);background:var(--s2)}
table.res thead th.tl{text-align:left;padding-left:14px}
table.res tbody tr{border-bottom:1px solid var(--bd);transition:background .1s}
table.res tbody tr:hover{background:var(--s2)}
table.res tbody tr.tot td{background:var(--s3);font-weight:600;border-top:2px solid var(--burdo-light)}
table.res td{padding:7px 10px;text-align:right;font-family:var(--fm)}
table.res td.tl{text-align:left;font-family:var(--f);padding-left:14px}
.en{font-weight:600;font-size:12px}
.es{font-size:10px;color:var(--muted);margin-top:1px}
.bc{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.bb{width:60px;height:5px;background:var(--dim);border-radius:3px;overflow:hidden;flex-shrink:0}
.bf{height:100%;border-radius:3px}
.pt{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;min-width:40px;text-align:center}
.seg{display:flex;height:5px;border-radius:2px;overflow:hidden;width:80px}
.bds{border-left:1px solid var(--bd)}
.ldot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:10px;color:var(--muted);align-items:center}
.pct2{font-size:9px;color:var(--muted);margin-top:1px}

/* CHARTS */
.ch-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chb{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:12px}
.cht{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

/* EXCEL BTN */
.xl-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:6px;border:1px solid rgba(139,28,42,.3);background:rgba(139,28,42,.06);color:var(--burdo);font-size:10px;font-weight:600;cursor:pointer;font-family:var(--f);transition:all .12s}
.xl-btn:hover{background:rgba(139,28,42,.12);border-color:var(--burdo)}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo">BML Collection<small>IVR Dashboard</small></div>
  <div id="sbItems"></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="topbar-title" id="mTitle">Dashboard IVR</div>
      <span class="badge" id="mBadge"></span>
      <span class="topbar-sub" id="mSub"></span>
      <span style="font-size:11px;color:var(--muted)" id="csvDate"></span>
    </div>
    <div class="kpi-row">
      <div class="kpi b"><div class="kpi-l">Teléfonos Total</div><div class="kpi-v" id="kv-tel">—</div><div class="kpi-s">universo del portfolio</div></div>
      <div class="kpi g"><div class="kpi-l">Contactados</div><div class="kpi-v" id="kv-con" style="color:var(--green)">—</div><div class="kpi-s" id="kv-pcon">—</div></div>
      <div class="kpi r"><div class="kpi-l">Sin Contacto</div><div class="kpi-v" id="kv-sin" style="color:var(--red)">—</div><div class="kpi-s" id="kv-psin">—</div></div>
      <div class="kpi a"><div class="kpi-l">IVRs Totales</div><div class="kpi-v" id="kv-ivr">—</div><div class="kpi-s">intentos acumulados</div></div>
      <div class="kpi b"><div class="kpi-l">Promedio IVR/Tel</div><div class="kpi-v" id="kv-avg">—</div><div class="kpi-s" id="kv-sivr">—</div></div>
    </div>
  </div>

  <div class="content">
    <!-- BUCKET CARDS — siempre visibles -->
    <div class="bucket-grid" id="bucket-cards"></div>

    <!-- FILTER PANEL -->
    <div class="filter-panel" id="filter-panel" style="display:none">
      <div class="filter-row" id="fr-ent"><span class="filter-label">Entidad</span></div>
      <div class="filter-row" id="fr-tramo"><span class="filter-label">Tramo</span></div>
      <div class="filter-row" id="fr-rango"><span class="filter-label">Rango</span></div>
    </div>

    <!-- TABS -->
    <div class="tab-bar" id="tab-bar" style="display:none">
      <span class="tab on" id="tab-todos"      onclick="setTab('todos')">Todos</span>
      <span class="tab"   id="tab-contactado"  onclick="setTab('contactado')">Contactado</span>
      <span class="tab"   id="tab-sin"         onclick="setTab('sin_contacto')">Sin Contacto</span>
    </div>

    <!-- MAIN CONTENT -->
    <div id="cnt"></div>
  </div>
</div>

<div class="csv-toast" id="csvToast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a9e6a;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;font-weight:500;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)"></div>

<script>
const CSV_URL='telefonos.csv';
const ENTS_COLORS=['#c42840','#1a9e6a','#d97706','#6366f1','#0ea5e9','#f43f5e','#10b981','#f59e0b','#8b5cf6','#14b8a6','#ef4444','#22c55e','#eab308','#3b82f6'];
const tC='rgba(26,13,15,.5)',gC='rgba(26,13,15,.08)';

// Órdenes y abreviaturas
const TRAMO_ORDER=['1) 0 a 30 dias','2) 31 a 60 dias','3) 61 a 90 dias','4) 91 a 180 dias','5) 181 a 360 dias','6) Mayor a 360 dias'];
const TRAMO_ABBR={'1) 0 a 30 dias':'0-30d','2) 31 a 60 dias':'31-60d','3) 61 a 90 dias':'61-90d','4) 91 a 180 dias':'91-180d','5) 181 a 360 dias':'181-360d','6) Mayor a 360 dias':'>360d'};
const RANGO_ORDER=['1) MENOR A $5.000','2) $5.001 a $10.000','3) $10.001 a $20.000','4) $20.001 a $35.000','5) $35.001 a $50.000','6) $50.001 a $100.000','7) $100.001 a $500.000','8) >$500.000'];
const RANGO_ABBR={'1) MENOR A $5.000':'<$5k','2) $5.001 a $10.000':'$5k-10k','3) $10.001 a $20.000':'$10k-20k','4) $20.001 a $35.000':'$20k-35k','5) $35.001 a $50.000':'$35k-50k','6) $50.001 a $100.000':'$50k-100k','7) $100.001 a $500.000':'$100k-500k','8) >$500.000':'>$500k'};

let allRows=[], ENTS=[], TRAMOS=[], RANGOS=[];
let activeTab='todos', curEnt='ALL';
let activeEnts=new Set(), activeTramos=new Set(), activeRangos=new Set();
// Per-entity filters
let entActiveTramos=new Set(), entActiveRangos=new Set();
let charts=[];

const fmt=n=>n==null?'—':parseInt(n).toLocaleString('es-AR');
const fmts=n=>n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'k':String(n);
const num=s=>parseInt(s)||0;
const pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'—';
function pcC(p){return p>=50?'var(--green)':p>=25?'var(--amber)':'var(--red)';}
function pcBg(p){return p>=50?'rgba(26,158,106,.12)':p>=25?'rgba(217,119,6,.12)':'rgba(220,38,38,.12)';}
function p2(v,tot){if(!tot||!v)return '';const p=Math.round(v/tot*100);return `<div class="pct2">${p}% del total</div>`;}

// ── CSV ───────────────────────────────────────────────────────────────────────
async function loadCSV(){
  const r=await fetch(CSV_URL);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt=await r.text();
  const lines=txt.trim().split('\n');
  const headers=parseCSVLine(lines[0]);
  allRows=lines.slice(1).filter(l=>l.trim()).map(l=>{
    const v=parseCSVLine(l);const o={};
    headers.forEach((h,i)=>o[h.trim()]=v[i]||'0');
    return o;
  });
  ENTS=[...new Set(allRows.map(r=>r.entidad))].sort();
  TRAMOS=[...new Set(allRows.map(r=>r.tramo_gestion))].sort((a,b)=>TRAMO_ORDER.indexOf(a)-TRAMO_ORDER.indexOf(b));
  RANGOS=[...new Set(allRows.map(r=>r.rango_deuda))].sort((a,b)=>RANGO_ORDER.indexOf(a)-RANGO_ORDER.indexOf(b));
  activeEnts=new Set(ENTS);activeTramos=new Set(TRAMOS);activeRangos=new Set(RANGOS);
  entActiveTramos=new Set(TRAMOS);entActiveRangos=new Set(RANGOS);
  buildSidebar();buildFilters();
  curEnt='ALL';sel('ALL');
  showToast('✓ Datos cargados');
}

function parseCSVLine(line){
  const res=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){res.push(cur);cur='';}else{cur+=c;}
  }
  res.push(cur);return res;
}

function showToast(msg,err=false){
  const t=document.getElementById('csvToast');
  t.textContent=msg;t.style.background=err?'#dc2626':'#1a9e6a';t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function buildSidebar(){
  const sb=document.getElementById('sbItems');sb.innerHTML='';

  // "Todas" item
  const allEl=document.createElement('div');
  allEl.className='sb-item';allEl.id='sb-ALL';
  const totAll=allRows.reduce((a,r)=>a+num(r.telefonos_total),0);
  allEl.innerHTML=`<span class="sb-name">Todas</span><span class="sb-val">${fmt(totAll)}</span>`;
  allEl.onclick=()=>sel('ALL');
  sb.appendChild(allEl);

  ENTS.forEach((e,i)=>{
    const tot=allRows.filter(r=>r.entidad===e).reduce((a,r)=>a+num(r.telefonos_total),0);
    const el=document.createElement('div');
    el.className='sb-item';el.id='sb-'+e;
    el.innerHTML=`<span class="sb-name"><span class="sb-dot" style="background:${ENTS_COLORS[i%ENTS_COLORS.length]}"></span>${e}</span><span class="sb-val">${fmt(tot)}</span>`;
    el.onclick=()=>sel(e);
    sb.appendChild(el);
  });
}

function sel(e){
  curEnt=e;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('sb-'+e);
  if(el) el.classList.add('active');
  charts.forEach(c=>{try{c.destroy();}catch(x){}});charts=[];

  if(e==='ALL'){
    document.getElementById('filter-panel').style.display='';
    document.getElementById('tab-bar').style.display='';
    activeTab='todos';
    setTabClass('todos');
    syncChips('ent');syncChips('tramo');syncChips('rango');
    renderAll();
  } else {
    // Vista entidad: ocultar filtros globales (tiene los propios), ocultar tabs
    document.getElementById('filter-panel').style.display='none';
    document.getElementById('tab-bar').style.display='none';
    entActiveTramos=new Set(TRAMOS);entActiveRangos=new Set(RANGOS);entActiveSegs=new Set();
    renderEnt(e);
  }
}

// ── FILTROS GLOBALES ──────────────────────────────────────────────────────────
function getActiveSet(group){
  return group==='ent'?activeEnts:group==='tramo'?activeTramos:activeRangos;
}
function getAllItems(group){
  return group==='ent'?ENTS:group==='tramo'?TRAMOS:RANGOS;
}

function buildFilters(){
  buildFilterRow('fr-ent',  ENTS,   'ent',   ENTS_COLORS, null);
  buildFilterRow('fr-tramo',TRAMOS, 'tramo', null,        TRAMO_ABBR);
  buildFilterRow('fr-rango',RANGOS, 'rango', null,        RANGO_ABBR);
}

function buildFilterRow(containerId,items,group,colors,abbrMap){
  const container=document.getElementById(containerId);
  const btnAll=document.createElement('button');
  btnAll.className='chip reset';btnAll.textContent='Todos';
  btnAll.onclick=()=>{
    const set=getActiveSet(group);
    getAllItems(group).forEach(i=>set.add(i));
    syncChips(group);
    if(curEnt==='ALL') renderAll();
  };
  container.appendChild(btnAll);
  items.forEach((item,i)=>{
    const b=document.createElement('button');
    b.className='chip on';b.dataset.val=item;b.dataset.group=group;
    b.textContent=abbrMap?abbrMap[item]||item:item;
    if(colors){
      const col=colors[i%colors.length];
      b.style.borderColor=col;b.style.color=col;b.style.background='rgba(0,0,0,.03)';
      b.dataset.color=col;
    }
    b.onclick=()=>{
      const set=getActiveSet(group);
      if(set.has(item)){if(set.size>1) set.delete(item);}
      else set.add(item);
      syncChips(group);
      if(curEnt==='ALL') renderAll();
    };
    container.appendChild(b);
  });
}

function syncChips(group){
  const set=getActiveSet(group);
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b=>{
    const on=set.has(b.dataset.val);
    if(b.dataset.color){
      b.style.opacity=on?'1':'0.3';
      // borde y texto apagados cuando off
      b.style.borderColor=on?b.dataset.color:'var(--bd)';
    } else {
      b.className=on?'chip on':'chip';
    }
  });
}

function filteredRows(){
  return allRows.filter(r=>activeEnts.has(r.entidad)&&activeTramos.has(r.tramo_gestion)&&activeRangos.has(r.rango_deuda));
}

// ── AGGREGATE ─────────────────────────────────────────────────────────────────
function agg(rows){
  const r={
    tel:rows.reduce((a,r)=>a+num(r.telefonos_total),0),
    con:rows.reduce((a,r)=>a+num(r.telefonos_contactados),0),
    sin:rows.reduce((a,r)=>a+num(r.telefonos_sin_contacto),0),
    s0:rows.reduce((a,r)=>a+num(r.telefonos_sin_ivr_total),0),
    s1:rows.reduce((a,r)=>a+num(r.telefonos_1_a_3_ivrs_total),0),
    s2:rows.reduce((a,r)=>a+num(r.telefonos_4_a_6_ivrs_total),0),
    s3:rows.reduce((a,r)=>a+num(r.telefonos_mayor_6_ivrs_total),0),
    c0:rows.reduce((a,r)=>a+num(r.contactado_sin_ivr),0),
    c1:rows.reduce((a,r)=>a+num(r.contactado_1_a_3_ivrs),0),
    c2:rows.reduce((a,r)=>a+num(r.contactado_4_a_6_ivrs),0),
    c3:rows.reduce((a,r)=>a+num(r.contactado_mayor_6_ivrs),0),
    sc0:rows.reduce((a,r)=>a+num(r.sin_contacto_sin_ivr),0),
    sc1:rows.reduce((a,r)=>a+num(r.sin_contacto_1_a_3_ivrs),0),
    sc2:rows.reduce((a,r)=>a+num(r.sin_contacto_4_a_6_ivrs),0),
    sc3:rows.reduce((a,r)=>a+num(r.sin_contacto_mayor_6_ivrs),0),
    ivr:rows.reduce((a,r)=>a+num(r.ivrs_total),0),
    ivr_con_total:rows.reduce((a,r)=>a+num(r.ivrs_tel_contactados),0),
    ivr_sin_total:rows.reduce((a,r)=>a+num(r.ivrs_tel_sin_contacto),0),
  };
  // Intensidad real desde columnas del CSV
  r.ivr_con = r.con>0 ? r.ivr_con_total/r.con : 0;
  r.ivr_sin = r.sin>0 ? r.ivr_sin_total/r.sin : 0;
  return r;
}

function aggByKey(rows,keyFn,sortFn){
  const map={};
  rows.forEach(r=>{
    const k=keyFn(r);
    if(!map[k]) map[k]={_key:k,_rows:[]};
    map[k]._rows.push(r);
  });
  return Object.values(map).sort(sortFn).map(g=>({_key:g._key,...agg(g._rows)}));
}

// ── TOPBAR KPIs ───────────────────────────────────────────────────────────────
function updateKPIs(rows,title,sub){
  const t=agg(rows);
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mSub').textContent=sub||'';
  const pc=t.tel?Math.round(t.con/t.tel*1000)/10:0;
  const col=pc>=50?'#1a9e6a':pc>=25?'#d97706':'#dc2626';
  const bg=pc>=50?'rgba(26,158,106,.12)':pc>=25?'rgba(217,119,6,.12)':'rgba(220,38,38,.12)';
  document.getElementById('mBadge').textContent=pc+'% CONTACTO';
  document.getElementById('mBadge').style.cssText=`background:${bg};color:${col};font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.06em`;
  document.getElementById('kv-tel').textContent=fmt(t.tel);
  document.getElementById('kv-con').textContent=fmt(t.con);
  document.getElementById('kv-pcon').textContent=pct(t.con,t.tel)+' del total';
  document.getElementById('kv-sin').textContent=fmt(t.sin);
  document.getElementById('kv-psin').textContent=pct(t.sin,t.tel)+' del total';
  document.getElementById('kv-ivr').textContent=fmt(t.ivr);
  document.getElementById('kv-avg').textContent=t.tel?(t.ivr/t.tel).toFixed(1):'—';
  document.getElementById('kv-sivr').textContent=`Con: ${t.ivr_con.toFixed(1)} · S/C: ${t.ivr_sin.toFixed(1)}`;
  return t;
}

// ── BUCKET CARDS (siempre visibles, se recalculan) ────────────────────────────
function updateBucketCards(t,tab){
  // Según tab: todos = s0..s3, contactado = c0..c3, sin = sc0..sc3
  const isAll=(tab==='todos'), isCon=(tab==='contactado');
  const v0=isAll?t.s0:isCon?t.c0:t.sc0;
  const v1=isAll?t.s1:isCon?t.c1:t.sc1;
  const v2=isAll?t.s2:isCon?t.c2:t.sc2;
  const v3=isAll?t.s3:isCon?t.c3:t.sc3;
  const base=isAll?t.tel:isCon?t.con:t.sin;
  const modeLabel=isAll?'del total':isCon?'de contactados':'de sin contacto';

  document.getElementById('bucket-cards').innerHTML=`
    <div class="bk" style="background:rgba(148,163,184,.06);border-color:rgba(148,163,184,.3)">
      <div class="bk-label" style="color:#64748b">Sin IVR</div>
      <div class="bk-val" style="color:#475569">${fmt(v0)}</div>
      <div class="bk-sub" style="color:#64748b">${base?(v0/base*100).toFixed(1):0}% ${modeLabel}</div>
      <div class="bk-bar"><div class="bk-bar-fill" style="width:${base?(v0/base*100):0}%;background:#94a3b8"></div></div>
    </div>
    <div class="bk" style="background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.3)">
      <div class="bk-label" style="color:#d97706">1 a 3 IVRs</div>
      <div class="bk-val" style="color:#b45309">${fmt(v1)}</div>
      <div class="bk-sub" style="color:#d97706">${base?(v1/base*100).toFixed(1):0}% ${modeLabel}</div>
      <div class="bk-bar"><div class="bk-bar-fill" style="width:${base?(v1/base*100):0}%;background:#f59e0b"></div></div>
    </div>
    <div class="bk" style="background:rgba(244,63,94,.06);border-color:rgba(244,63,94,.3)">
      <div class="bk-label" style="color:#f43f5e">4 a 6 IVRs</div>
      <div class="bk-val" style="color:#be123c">${fmt(v2)}</div>
      <div class="bk-sub" style="color:#f43f5e">${base?(v2/base*100).toFixed(1):0}% ${modeLabel}</div>
      <div class="bk-bar"><div class="bk-bar-fill" style="width:${base?(v2/base*100):0}%;background:#f43f5e"></div></div>
    </div>
    <div class="bk" style="background:rgba(139,28,42,.06);border-color:rgba(139,28,42,.3)">
      <div class="bk-label" style="color:var(--burdo)">&gt;6 IVRs</div>
      <div class="bk-val" style="color:var(--burdo)">${fmt(v3)}</div>
      <div class="bk-sub" style="color:var(--muted)">${base?(v3/base*100).toFixed(1):0}% ${modeLabel}</div>
      <div class="bk-bar"><div class="bk-bar-fill" style="width:${base?(v3/base*100):0}%;background:#8b1c2a"></div></div>
    </div>`;
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function setTab(tab){
  activeTab=tab;
  setTabClass(tab);
  renderAll();
}

function setTabClass(tab){
  document.getElementById('tab-todos').className='tab'+(tab==='todos'?' on':'');
  document.getElementById('tab-contactado').className='tab'+(tab==='contactado'?' on':'');
  document.getElementById('tab-sin').className='tab'+(tab==='sin_contacto'?' on':'');
}

// ── RENDER ALL (vista global) ─────────────────────────────────────────────────
function renderAll(){
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  const rows=filteredRows();
  const t=updateKPIs(rows,'Todas las entidades','');
  updateBucketCards(t,activeTab);

  if(activeTab==='todos'){
    renderAllTodos(rows,t);
  } else {
    renderAllApertura(rows,t,activeTab);
  }
}

function renderAllTodos(rows,t){
  const byEnt  =aggByKey(rows,r=>r.entidad,(a,b)=>a._key.localeCompare(b._key));
  const byTramo=aggByKey(rows,r=>r.tramo_gestion,(a,b)=>TRAMO_ORDER.indexOf(a._key)-TRAMO_ORDER.indexOf(b._key));
  const byRango=aggByKey(rows,r=>r.rango_deuda,(a,b)=>RANGO_ORDER.indexOf(a._key)-RANGO_ORDER.indexOf(b._key));
  byEnt.forEach(d=>d.pct=d.tel?Math.round(d.con/d.tel*1000)/10:0);
  byTramo.forEach(d=>d.pct=d.tel?Math.round(d.con/d.tel*1000)/10:0);
  byRango.forEach(d=>d.pct=d.tel?Math.round(d.con/d.tel*1000)/10:0);
  t.pct=t.tel?Math.round(t.con/t.tel*1000)/10:0;

  const legend=`<div class="legend">
    <span><span class="ldot" style="background:#94a3b8"></span>Sin IVR</span>
    <span><span class="ldot" style="background:#f59e0b"></span>1–3 IVRs</span>
    <span><span class="ldot" style="background:#f43f5e"></span>4–6 IVRs</span>
    <span><span class="ldot" style="background:#8b1c2a"></span>&gt;6 IVRs</span>
    <span style="margin-left:6px;color:var(--bd)">|</span>
    <span>Hacé clic en una entidad para ver el detalle</span>
  </div>`;

  // Filas de entidad con onclick para navegar al detalle
  const entRows=byEnt.map(d=>`<tr style="cursor:pointer" onclick="sel('${d._key}')">${ivrRowInner(d._key,'',d,t)}</tr>`).join('');

  document.getElementById('cnt').innerHTML=`
    ${legend}
    <div class="tbl-header">
      <div class="sec-label">Por Entidad</div>
      <button class="xl-btn" onclick="exportXL('ent','todos')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${ivrHead()}<tbody>${entRows}${ivrTot(t)}</tbody></table></div>

    <div class="tbl-header" style="margin-top:4px">
      <div class="sec-label">Por Tramo de Gestión</div>
      <button class="xl-btn" onclick="exportXL('tramo','todos')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${ivrHead()}<tbody>${byTramo.map(d=>ivrRow(d._key,'',d,t)).join('')}${ivrTot(t)}</tbody></table></div>

    <div class="tbl-header" style="margin-top:4px">
      <div class="sec-label">Por Rango de Deuda</div>
      <button class="xl-btn" onclick="exportXL('rango','todos')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${ivrHead()}<tbody>${byRango.map(d=>ivrRow(d._key,'',d,t)).join('')}${ivrTot(t)}</tbody></table></div>

    <div class="ch-row" style="margin-top:4px">
      <div class="chb"><div class="cht">Distribución IVR por Tramo</div><canvas id="cT" height="180"></canvas></div>
      <div class="chb"><div class="cht">Distribución IVR por Rango</div><canvas id="cR" height="180"></canvas></div>
    </div>`;

  setTimeout(()=>{
    charts.push(makeStackedBar('cT',byTramo.map(d=>TRAMO_ABBR[d._key]||d._key),byTramo));
    charts.push(makeStackedBar('cR',byRango.map(d=>RANGO_ABBR[d._key]||d._key),byRango));
  },50);
}

function renderAllApertura(rows,t,tab){
  const isCon=(tab==='contactado');
  const k0=isCon?'c0':'sc0',k1=isCon?'c1':'sc1',k2=isCon?'c2':'sc2',k3=isCon?'c3':'sc3';

  // Tabla detalle por entidad + tramo + rango
  const map={};
  rows.forEach(r=>{
    const key=r.entidad+'||'+r.tramo_gestion+'||'+r.rango_deuda;
    if(!map[key]) map[key]={ent:r.entidad,tramo:r.tramo_gestion,rango:r.rango_deuda,...agg([])};
    const m=map[key],a=agg([r]);
    Object.keys(a).forEach(k=>m[k]+=a[k]);
  });
  const data=Object.values(map).sort((a,b)=>a.ent.localeCompare(b.ent)||TRAMO_ORDER.indexOf(a.tramo)-TRAMO_ORDER.indexOf(b.tramo)||RANGO_ORDER.indexOf(a.rango)-RANGO_ORDER.indexOf(b.rango));

  const colorMain=isCon?'var(--green)':'var(--red)';
  const thead=`<thead><tr>
    <th class="tl">Entidad</th><th class="tl">Tramo</th><th class="tl">Rango Deuda</th>
    <th style="color:${colorMain}">${isCon?'Contactados':'Sin Contacto'}</th>
    <th style="color:#64748b">Sin IVR</th>
    <th style="color:#d97706">1–3 IVRs</th>
    <th style="color:#f43f5e">4–6 IVRs</th>
    <th style="color:var(--burdo)">&gt;6 IVRs</th>
    <th>% &gt;6</th><th class="tl">Dist.</th>
  </tr></thead>`;

  const trows=data.map(d=>{
    const base=isCon?d.con:d.sin;
    const v0=d[k0],v1=d[k1],v2=d[k2],v3=d[k3];
    const pGt6=base?(v3/base*100).toFixed(1):0;
    const t2=base||1;
    return`<tr>
      <td class="tl"><div class="en">${d.ent}</div></td>
      <td class="tl"><div class="es">${TRAMO_ABBR[d.tramo]||d.tramo}</div></td>
      <td class="tl"><div class="es">${RANGO_ABBR[d.rango]||d.rango}</div></td>
      <td style="color:${colorMain};font-weight:600">${fmt(base)}</td>
      <td style="color:#64748b">${fmt(v0)}</td>
      <td style="color:#d97706">${fmt(v1)}</td>
      <td style="color:#f43f5e">${fmt(v2)}</td>
      <td style="color:var(--burdo);font-weight:600">${fmt(v3)}</td>
      <td><span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:${parseFloat(pGt6)>50?'#fee2e2':parseFloat(pGt6)>25?'#fef9c3':'#dcfce7'};color:${parseFloat(pGt6)>50?'#991b1b':parseFloat(pGt6)>25?'#854d0e':'#166534'}">${pGt6}%</span></td>
      <td><div class="seg">
        <div style="width:${v0/t2*100}%;background:#94a3b8"></div>
        <div style="width:${v1/t2*100}%;background:#f59e0b"></div>
        <div style="width:${v2/t2*100}%;background:#f43f5e"></div>
        <div style="width:${v3/t2*100}%;background:#8b1c2a"></div>
      </div></td>
    </tr>`;
  }).join('');

  const totBase=isCon?t.con:t.sin;
  const tv0=t[k0],tv1=t[k1],tv2=t[k2],tv3=t[k3];
  const tGt6=totBase?(tv3/totBase*100).toFixed(1):0;
  const ttt=totBase||1;
  const totrow=`<tr class="tot">
    <td class="tl" colspan="3">TOTAL</td>
    <td style="color:${colorMain}">${fmt(totBase)}</td>
    <td>${fmt(tv0)}</td><td>${fmt(tv1)}</td><td>${fmt(tv2)}</td>
    <td style="color:var(--burdo);font-weight:700">${fmt(tv3)}</td>
    <td>${tGt6}%</td>
    <td><div class="seg">
      <div style="width:${tv0/ttt*100}%;background:#94a3b8"></div>
      <div style="width:${tv1/ttt*100}%;background:#f59e0b"></div>
      <div style="width:${tv2/ttt*100}%;background:#f43f5e"></div>
      <div style="width:${tv3/ttt*100}%;background:#8b1c2a"></div>
    </div></td>
  </tr>`;

  document.getElementById('cnt').innerHTML=`
    <div class="tbl-header">
      <div class="sec-label">Detalle por Entidad · Tramo · Rango</div>
      <button class="xl-btn" onclick="exportXL('detalle','${tab}')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${thead}<tbody>${trows}${totrow}</tbody></table></div>`;
}

// ── RENDER ENTIDAD (detalle) ───────────────────────────────────────────────────
let entActiveSegs=new Set();

function renderEnt(en){
  const idx=ENTS.indexOf(en);
  const entRows=allRows.filter(r=>r.entidad===en);

  // Segmentos solo para MEL0
  const SEGS=[...new Set(entRows.map(r=>r.segmento||'').filter(s=>s!=''))].sort();
  const isMEL0=(en==='MEL0');
  if(isMEL0&&entActiveSegs.size===0) entActiveSegs=new Set(SEGS);

  const filtRows=entRows.filter(r=>
    entActiveTramos.has(r.tramo_gestion)&&
    entActiveRangos.has(r.rango_deuda)&&
    (!isMEL0||entActiveSegs.has(r.segmento||''))
  );
  const t=updateKPIs(filtRows,en,`${fmt(filtRows.reduce((a,r)=>a+num(r.telefonos_total),0))} teléfonos`);
  updateBucketCards(t,'todos');

  const byTramo=aggByKey(filtRows,r=>r.tramo_gestion,(a,b)=>TRAMO_ORDER.indexOf(a._key)-TRAMO_ORDER.indexOf(b._key));
  const byRango=aggByKey(filtRows,r=>r.rango_deuda,(a,b)=>RANGO_ORDER.indexOf(a._key)-RANGO_ORDER.indexOf(b._key));
  byTramo.forEach(d=>d.pct=d.tel?Math.round(d.con/d.tel*1000)/10:0);
  byRango.forEach(d=>d.pct=d.tel?Math.round(d.con/d.tel*1000)/10:0);
  t.pct=t.tel?Math.round(t.con/t.tel*1000)/10:0;

  // filtros por entidad
  const tramoChips=TRAMOS.map(t=>`<button class="chip${entActiveTramos.has(t)?' on':''}" data-ent-tramo="${t}" onclick="toggleEntTramo('${t}','${en}')">${TRAMO_ABBR[t]||t}</button>`).join('');
  const rangoChips=RANGOS.map(r=>`<button class="chip${entActiveRangos.has(r)?' on':''}" data-ent-rango="${r}" onclick="toggleEntRango('${r}','${en}')">${RANGO_ABBR[r]||r}</button>`).join('');
  const segRow=isMEL0?`<div class="filter-row">
    <span class="filter-label">Segmento</span>
    <button class="chip reset" onclick="selectAllEntSegs('${en}')">Todos</button>
    ${SEGS.map(s=>`<button class="chip${entActiveSegs.has(s)?' on':''}" data-ent-seg="${s}" onclick="toggleEntSeg('${s}','${en}')">Seg. ${s}</button>`).join('')}
  </div>`:'';

  const filterBar=`<div class="filter-panel" style="margin-bottom:14px">
    <div class="filter-row">
      <span class="filter-label">Tramo</span>
      <button class="chip reset" onclick="selectAllEntTramos('${en}')">Todos</button>
      ${tramoChips}
    </div>
    <div class="filter-row">
      <span class="filter-label">Rango</span>
      <button class="chip reset" onclick="selectAllEntRangos('${en}')">Todos</button>
      ${rangoChips}
    </div>
    ${segRow}
  </div>`;

  const legend=`<div class="legend">
    <span><span class="ldot" style="background:#94a3b8"></span>Sin IVR</span>
    <span><span class="ldot" style="background:#f59e0b"></span>1–3 IVRs</span>
    <span><span class="ldot" style="background:#f43f5e"></span>4–6 IVRs</span>
    <span><span class="ldot" style="background:#8b1c2a"></span>&gt;6 IVRs</span>
  </div>`;

  document.getElementById('cnt').innerHTML=`
    ${filterBar}
    ${legend}
    <div class="tbl-header">
      <div class="sec-label">Por Tramo de Gestión</div>
      <button class="xl-btn" onclick="exportXLEnt('${en}','tramo')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${ivrHead()}<tbody>${byTramo.map(d=>ivrRow(d._key,'',d,t)).join('')}${ivrTot(t)}</tbody></table></div>

    <div class="tbl-header" style="margin-top:4px">
      <div class="sec-label">Por Rango de Deuda</div>
      <button class="xl-btn" onclick="exportXLEnt('${en}','rango')">⬇ Excel</button>
    </div>
    <div class="tbl-wrap"><table class="res">${ivrHead()}<tbody>${byRango.map(d=>ivrRow(d._key,'',d,t)).join('')}${ivrTot(t)}</tbody></table></div>

    <div class="ch-row" style="margin-top:4px">
      <div class="chb"><div class="cht">IVR por Tramo</div><canvas id="cET" height="180"></canvas></div>
      <div class="chb"><div class="cht">IVR por Rango</div><canvas id="cER" height="180"></canvas></div>
    </div>`;

  setTimeout(()=>{
    charts.push(makeStackedBar('cET',byTramo.map(d=>TRAMO_ABBR[d._key]||d._key),byTramo));
    charts.push(makeStackedBar('cER',byRango.map(d=>RANGO_ABBR[d._key]||d._key),byRango));
  },50);
}

function toggleEntSeg(s,en){
  if(entActiveSegs.has(s)){if(entActiveSegs.size>1)entActiveSegs.delete(s);}
  else entActiveSegs.add(s);
  document.querySelectorAll('[data-ent-seg]').forEach(b=>b.className=entActiveSegs.has(b.dataset.entSeg)?'chip on':'chip');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}
function selectAllEntSegs(en){
  const entRows=allRows.filter(r=>r.entidad===en);
  const SEGS=[...new Set(entRows.map(r=>r.segmento||'').filter(s=>s!=''))].sort();
  entActiveSegs=new Set(SEGS);
  document.querySelectorAll('[data-ent-seg]').forEach(b=>b.className='chip on');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}

function toggleEntTramo(t,en){
  if(entActiveTramos.has(t)){if(entActiveTramos.size>1)entActiveTramos.delete(t);}
  else entActiveTramos.add(t);
  document.querySelectorAll('[data-ent-tramo]').forEach(b=>b.className=entActiveTramos.has(b.dataset.entTramo)?'chip on':'chip');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}
function selectAllEntTramos(en){
  entActiveTramos=new Set(TRAMOS);
  document.querySelectorAll('[data-ent-tramo]').forEach(b=>b.className='chip on');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}
function toggleEntRango(r,en){
  if(entActiveRangos.has(r)){if(entActiveRangos.size>1)entActiveRangos.delete(r);}
  else entActiveRangos.add(r);
  document.querySelectorAll('[data-ent-rango]').forEach(b=>b.className=entActiveRangos.has(b.dataset.entRango)?'chip on':'chip');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}
function selectAllEntRangos(en){
  entActiveRangos=new Set(RANGOS);
  document.querySelectorAll('[data-ent-rango]').forEach(b=>b.className='chip on');
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  renderEnt(en);
}

// ── TABLE HELPERS ─────────────────────────────────────────────────────────────
function ivrHead(){
  return`<thead><tr>
    <th class="tl">Grupo</th>
    <th>Teléfonos</th><th>Contactados</th><th>Sin Contacto</th><th>% Contacto</th>
    <th class="bds" style="color:#64748b">Sin IVR</th>
    <th style="color:#d97706">1–3 IVRs</th>
    <th style="color:#f43f5e">4–6 IVRs</th>
    <th style="color:var(--burdo)">&gt;6 IVRs</th>
    <th>IVRs Total</th>
    <th>Prom/Tel</th>
    <th style="color:var(--green)">Prom Con.</th>
    <th style="color:var(--red)">Prom S/C</th>
    <th class="tl">Dist. IVR</th>
  </tr></thead>`;
}

function ivrRowInner(label,sub,d,tot){
  const pc=d.pct||0;const tt=d.tel||1;
  const promCon=d.ivr_con!=null?d.ivr_con.toFixed(1):'—';
  const promSin=d.ivr_sin!=null?d.ivr_sin.toFixed(1):'—';
  return`<td class="tl"><div class="en">${label}</div>${sub?`<div class="es">${sub}</div>`:''}</td>
    <td>${fmt(d.tel)}</td>
    <td style="color:var(--green)">${fmt(d.con)}${p2(d.con,tot.con)}</td>
    <td style="color:var(--red)">${fmt(d.sin)}${p2(d.sin,tot.sin)}</td>
    <td><div class="bc"><div class="bb"><div class="bf" style="width:${pc}%;background:${pcC(pc)}"></div></div><span class="pt" style="color:${pcC(pc)};background:${pcBg(pc)}">${pc}%</span></div></td>
    <td class="bds" style="color:#64748b">${fmt(d.s0)}${p2(d.s0,tot.s0)}</td>
    <td style="color:#d97706">${fmt(d.s1)}${p2(d.s1,tot.s1)}</td>
    <td style="color:#f43f5e">${fmt(d.s2)}${p2(d.s2,tot.s2)}</td>
    <td style="color:var(--burdo);font-weight:600">${fmt(d.s3)}${p2(d.s3,tot.s3)}</td>
    <td style="font-weight:600">${fmt(d.ivr)}</td>
    <td>${d.tel?(d.ivr/d.tel).toFixed(1):'—'}</td>
    <td style="color:var(--green)">${promCon}</td>
    <td style="color:var(--red)">${promSin}</td>
    <td><div class="seg">
      <div style="width:${d.s0/tt*100}%;background:#94a3b8"></div>
      <div style="width:${d.s1/tt*100}%;background:#f59e0b"></div>
      <div style="width:${d.s2/tt*100}%;background:#f43f5e"></div>
      <div style="width:${d.s3/tt*100}%;background:#8b1c2a"></div>
    </div></td>`;
}
function ivrRow(label,sub,d,tot){
  return`<tr>${ivrRowInner(label,sub,d,tot)}</tr>`;
}

function ivrTot(t){
  const pc=t.pct||0;const tt=t.tel||1;
  const promCon=t.ivr_con!=null?t.ivr_con.toFixed(1):'—';
  const promSin=t.ivr_sin!=null?t.ivr_sin.toFixed(1):'—';
  return`<tr class="tot"><td class="tl">TOTAL</td>
    <td>${fmt(t.tel)}</td>
    <td style="color:var(--green)">${fmt(t.con)}</td>
    <td style="color:var(--red)">${fmt(t.sin)}</td>
    <td><div class="bc"><div class="bb"><div class="bf" style="width:${pc}%;background:${pcC(pc)}"></div></div><span class="pt" style="color:${pcC(pc)};background:${pcBg(pc)}">${pc}%</span></div></td>
    <td class="bds" style="color:#64748b">${fmt(t.s0)}</td>
    <td style="color:#d97706">${fmt(t.s1)}</td>
    <td style="color:#f43f5e">${fmt(t.s2)}</td>
    <td style="color:var(--burdo);font-weight:700">${fmt(t.s3)}</td>
    <td style="font-weight:700">${fmt(t.ivr)}</td>
    <td>${t.tel?(t.ivr/t.tel).toFixed(1):'—'}</td>
    <td style="color:var(--green);font-weight:700">${promCon}</td>
    <td style="color:var(--red);font-weight:700">${promSin}</td>
    <td><div class="seg">
      <div style="width:${t.s0/tt*100}%;background:#94a3b8"></div>
      <div style="width:${t.s1/tt*100}%;background:#f59e0b"></div>
      <div style="width:${t.s2/tt*100}%;background:#f43f5e"></div>
      <div style="width:${t.s3/tt*100}%;background:#8b1c2a"></div>
    </div></td>
  </tr>`;
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
function makeStackedBar(canvasId,labels,data){
  return new Chart(document.getElementById(canvasId),{type:'bar',
    data:{labels,datasets:[
      {label:'Sin IVR',data:data.map(d=>d.s0),backgroundColor:'#94a3b8',stack:'s'},
      {label:'1–3',data:data.map(d=>d.s1),backgroundColor:'#f59e0b',stack:'s'},
      {label:'4–6',data:data.map(d=>d.s2),backgroundColor:'#f43f5e',stack:'s'},
      {label:'>6',data:data.map(d=>d.s3),backgroundColor:'#8b1c2a',stack:'s'},
    ]},
    options:{responsive:true,
      plugins:{legend:{labels:{color:tC,font:{size:10}},position:'bottom'},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw)}`}}},
      scales:{x:{stacked:true,ticks:{color:tC,font:{size:9},autoSkip:false,maxRotation:35},grid:{display:false}},
        y:{stacked:true,ticks:{color:tC,callback:v=>fmts(v)},grid:{color:gC}}}}});
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function exportXL(type,tab){
  const rows=filteredRows();
  let data;
  if(type==='ent'||type==='tramo'||type==='rango'){
    const keyFn=type==='ent'?r=>r.entidad:type==='tramo'?r=>r.tramo_gestion:r=>r.rango_deuda;
    const sortFn=type==='ent'?(a,b)=>a._key.localeCompare(b._key):type==='tramo'?(a,b)=>TRAMO_ORDER.indexOf(a._key)-TRAMO_ORDER.indexOf(b._key):(a,b)=>RANGO_ORDER.indexOf(a._key)-RANGO_ORDER.indexOf(b._key);
    data=aggByKey(rows,keyFn,sortFn).map(d=>({
      'Grupo':d._key,'Teléfonos':d.tel,'Contactados':d.con,'Sin Contacto':d.sin,
      'Sin IVR':d.s0,'1-3 IVRs':d.s1,'4-6 IVRs':d.s2,'>6 IVRs':d.s3,'IVRs Total':d.ivr
    }));
  } else {
    const isCon=(tab==='contactado');
    data=rows.map(r=>({
      'Entidad':r.entidad,'Tramo':r.tramo_gestion,'Rango':r.rango_deuda,
      [isCon?'Contactados':'Sin Contacto']:num(isCon?r.telefonos_contactados:r.telefonos_sin_contacto),
      'Sin IVR':num(isCon?r.contactado_sin_ivr:r.sin_contacto_sin_ivr),
      '1-3':num(isCon?r.contactado_1_a_3_ivrs:r.sin_contacto_1_a_3_ivrs),
      '4-6':num(isCon?r.contactado_4_a_6_ivrs:r.sin_contacto_4_a_6_ivrs),
      '>6':num(isCon?r.contactado_mayor_6_ivrs:r.sin_contacto_mayor_6_ivrs),
    }));
  }
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'IVR');
  XLSX.writeFile(wb,`ivr_${type}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportXLEnt(en,type){
  const rows=allRows.filter(r=>r.entidad===en&&entActiveTramos.has(r.tramo_gestion)&&entActiveRangos.has(r.rango_deuda));
  const keyFn=type==='tramo'?r=>r.tramo_gestion:r=>r.rango_deuda;
  const sortFn=type==='tramo'?(a,b)=>TRAMO_ORDER.indexOf(a._key)-TRAMO_ORDER.indexOf(b._key):(a,b)=>RANGO_ORDER.indexOf(a._key)-RANGO_ORDER.indexOf(b._key);
  const data=aggByKey(rows,keyFn,sortFn).map(d=>({
    'Grupo':d._key,'Teléfonos':d.tel,'Contactados':d.con,'Sin Contacto':d.sin,
    'Sin IVR':d.s0,'1-3 IVRs':d.s1,'4-6 IVRs':d.s2,'>6 IVRs':d.s3,'IVRs Total':d.ivr
  }));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,en+'_'+type);
  XLSX.writeFile(wb,`ivr_${en}_${type}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
